[workspace]
resolver = "2"
members = [
    "crates/configure-dhcp",
    "crates/configure-ethernet",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["BigFred"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true
