[package]
name = "configure-dhcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Event WiFi DHCP for BigFred OS — starts dnsmasq when a pluggable stack (Omada) is detected"
readme = "README.md"

[lib]
name = "configure_dhcp"
path = "src/lib.rs"

[[bin]]
name = "configure-dhcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
