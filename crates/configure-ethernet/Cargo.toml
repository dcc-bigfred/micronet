[package]
name = "configure-ethernet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "One-shot Ethernet bring-up for BigFred OS (static club subnets, then DHCP)"
readme = "README.md"

[[bin]]
name = "configure-ethernet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
