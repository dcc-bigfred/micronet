[package]
name = "micronet"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ethernet bring-up and DHCP gateway daemon for BigFred OS"
readme = "../../README.md"

[lib]
name = "micronet"
path = "src/lib.rs"

[[bin]]
name = "micronet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Git HTTPS. Pin the rust-commons commit that adds dcc-daemon
# (https://github.com/dcc-bigfred/rust-commons/pull/1). After that lands on
# main, switch to `branch = "main"` and run `make deps-update`.
dcc-daemon = { git = "https://github.com/dcc-bigfred/rust-commons.git", rev = "bdc4155f124f82ce59c9a8801b4952be8e06f4a2" }
dhcproto = "0.12"
env_logger = "0.11"
ipnet = { version = "2", features = ["serde"] }
log = "0.4"
nix = { version = "0.29", features = ["signal", "process", "socket", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
